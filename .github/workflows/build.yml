on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Lyric Cue
        uses: actions/checkout@v4

      - name: Checkout Resolume FFGL SDK
        uses: actions/checkout@v4
        with:
          repository: resolume/ffgl
          path: ffgl
          fetch-depth: 1

      - name: Install Lyric Cue source
        shell: pwsh
        run: |
          Copy-Item "src/LyricCue.cpp" "ffgl/source/plugins/Gradients/FFGLGradients.cpp" -Force
          Copy-Item "src/LyricCue.h" "ffgl/source/plugins/Gradients/FFGLGradients.h" -Force

      - name: Locate Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $path = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (!$path) {
            Write-Error "MSVC build tools were not found."
          }

          "VS_PATH=$path" >> $env:GITHUB_OUTPUT

      - name: Build FFGL
        shell: cmd
        run: |
          call "${{ steps.vs.outputs.VS_PATH }}\Common7\Tools\VsDevCmd.bat" -arch=x64
          msbuild "ffgl\build\windows\FFGLPlugins.sln" /m /p:Configuration=Release /p:Platform=x64

      - name: Package DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem "ffgl" -Recurse -Filter "FFGLGradients.dll" |
            Where-Object { $_.FullName -match "\\binaries\\x64\\Release\\" } |
            Select-Object -First 1

          if (!$dll) {
            Write-Error "Lyric Cue DLL was not found."
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item $dll.FullName "dist\LyricCue.dll"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: LyricCue-Windows-x64
          path: dist/LyricCue.dll
